name: Build Windows MSIX

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      MSIX_IDENTITY_NAME: ${{ secrets.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        run: npm ci --no-fund

      - name: Güvenlik kontrolleri
        run: |
          npm run security:check
          npm run security:audit

      - name: Testleri çalıştır
        run: npm test

      - name: Store kimliğini uygula
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content "Package.appxmanifest"
          if ($env:MSIX_IDENTITY_NAME) { $manifest.Package.Identity.Name = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $manifest.Package.Identity.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $manifest.Package.Properties.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          $manifest.Save((Resolve-Path "Package.appxmanifest"))

      - name: MSIX oluştur
        run: npm run make:msix

      - name: ZIP taşınabilir paket oluştur
        run: npm run make:zip

      - name: Derleme çıktılarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Everstep-Windows-${{ github.ref_name }}
          path: |
            out/make/**/*.msix
            out/make/**/*.zip
          if-no-files-found: error
